name: CI

# The headless strip deleted every upstream workflow, including secret
# scanning, and left the fork with no automated coverage at all - on the
# branch that introduces database credential handling and a service installer.
# This is the replacement, scoped to what the pruned workspace actually is: a
# Windows-only capture agent.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gitleaks CLI is MIT-licensed and free; only the marketplace Action
      # wrapper demands a paid licence for organization-owned repositories,
      # which is what upstream's deleted gitleaks.yml used. Invoke the binary
      # directly so the scan does not depend on a subscription.
      - name: Install gitleaks
        run: |
          version=8.28.0
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `--no-git`: scan the tree as it stands, not the commit history.
      #
      # This is a fork of a large upstream repository, and its history contains
      # every example key, telemetry token, and doc snippet upstream ever
      # committed - crates/screenpipe-redact, ee/, apps/screenpipe-app-tauri,
      # packages/cli, docs/mintlify. All of it was deleted by the headless
      # strip, none of it is ours, and none of it is reachable from what this
      # workspace ships. A history scan therefore fails permanently on findings
      # nobody here can act on, which trains people to ignore the job - worse
      # than having no scan.
      #
      # The question worth failing on is whether the code we ship contains a
      # credential. That is exactly what a working-tree scan answers.
      - name: Scan the shipped tree
        run: gitleaks detect --source . --no-git --redact --verbose --exit-code 1

  build:
    name: Build and test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action. rust-toolchain.toml already pins the channel, the
      # msvc target, and the rustfmt/clippy components, and `rustup show`
      # installs exactly what that file asks for. Layering an action on top
      # only creates a second source of truth that can disagree with it.
      - name: Install the pinned toolchain
        shell: pwsh
        run: |
          rustup show
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # Two classes of test are deliberately excluded here, and each is
      # excluded for a reason that a hosted runner cannot satisfy:
      #
      #   postgres_writer  needs a live PostgreSQL 18 server and an injected
      #                    SCREEN_MEMORY_DATABASE_URL.
      #   the live-desktop targets (capture_content, merge_boundary_live,
      #                    foreground_capture, browser_url_live, windows_ocr,
      #                    wgc_timeout_ab) need an unlocked interactive
      #                    desktop. Their capability probe now FAILS rather
      #                    than skips when the desktop is unavailable, and a
      #                    skip that is invisible in CI is the same lie
      #                    #[ignore] was.
      #
      # Both are run locally on the qualification machine. CI covers the
      # deterministic remainder; it is not a substitute for that run.
      - name: Test (deterministic targets)
        run: >
          cargo test --workspace
          --lib --bins
          --test cadence
          --test merge_contract
          --test text_hash
          --test debug_redaction
          --test browser_url
          --test cli_surface

      - name: Verify the workspace stayed pruned
        shell: pwsh
        run: ./scripts/verify-pruned.ps1

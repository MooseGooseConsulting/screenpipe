name: CI

# The headless strip deleted every upstream workflow, including secret
# scanning, and left the fork with no automated coverage at all - on the
# branch that introduces database credential handling and a service installer.
# This is the replacement, scoped to what the pruned workspace actually is: a
# Windows-only capture agent.

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gitleaks CLI is MIT-licensed and free; only the marketplace Action
      # wrapper demands a paid licence for organization-owned repositories,
      # which is what upstream's deleted gitleaks.yml used. Invoke the binary
      # directly so the scan does not depend on a subscription.
      - name: Install gitleaks
        run: |
          version=8.28.0
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `--no-git`: scan the tree as it stands, not the commit history.
      #
      # This is a fork of a large upstream repository, and its history contains
      # every example key, telemetry token, and doc snippet upstream ever
      # committed - crates/screenpipe-redact, ee/, apps/screenpipe-app-tauri,
      # packages/cli, docs/mintlify. All of it was deleted by the headless
      # strip, none of it is ours, and none of it is reachable from what this
      # workspace ships. A history scan therefore fails permanently on findings
      # nobody here can act on, which trains people to ignore the job - worse
      # than having no scan.
      #
      # The question worth failing on is whether the code we ship contains a
      # credential. That is exactly what a working-tree scan answers.
      - name: Scan the shipped tree
        run: gitleaks detect --source . --no-git --redact --verbose --exit-code 1

  build:
    name: Build and test, non-audio (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action. rust-toolchain.toml already pins the channel, the
      # msvc target, and the rustfmt/clippy components, and `rustup show`
      # installs exactly what that file asks for. Layering an action on top
      # only creates a second source of truth that can disagree with it.
      - name: Install the pinned toolchain
        shell: pwsh
        run: |
          rustup show
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude screenpipe-audio --all-targets

      # Two classes of test are deliberately excluded here, and each is
      # excluded for a reason that a hosted runner cannot satisfy:
      #
      #   postgres_writer  needs a live PostgreSQL 18 server and a
      #                    SCREEN_MEMORY_TEST_DATABASE_URL naming a disposable
      #                    `_test` database. Unset, it skips rather than fails,
      #                    so listing it here would report `ok` for a suite
      #                    that asserted nothing - the same invisible-skip lie
      #                    the live-desktop probe below exists to avoid.
      #   the live-desktop targets (capture_content, merge_boundary_live,
      #                    foreground_capture, browser_url_live, windows_ocr,
      #                    wgc_timeout_ab) need an unlocked interactive
      #                    desktop. Their capability probe now FAILS rather
      #                    than skips when the desktop is unavailable, and a
      #                    skip that is invisible in CI is the same lie
      #                    #[ignore] was.
      #
      # Both are run locally on the qualification machine. CI covers the
      # deterministic remainder; it is not a substitute for that run.
      - name: Test (deterministic targets)
        run: >
          cargo test --workspace
          --exclude screenpipe-audio
          --lib --bins
          --test cadence
          --test merge_contract
          --test text_hash
          --test debug_redaction
          --test browser_url
          --test cli_surface

      - name: Verify the workspace stayed pruned
        shell: pwsh
        run: ./scripts/verify-pruned.ps1

  audio:
    name: Audio crate and CLI feature (windows, LLVM 18.1.8, Ninja 1.12.1)
    runs-on: windows-latest
    env:
      LLVM_VERSION: 18.1.8
      # SHA-256 values published in the matching Microsoft winget-pkgs
      # manifests for these official GitHub release artifacts.
      LLVM_SHA256: 94AF030060D88CC17E9F00EF1663EBDC1126B35E16BEBDFA1E807984B70ABD8F
      NINJA_VERSION: 1.12.1
      NINJA_SHA256: F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned LLVM and libclang
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.exe"
          $uri = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if (-not [string]::Equals($actualSha256, $env:LLVM_SHA256, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "LLVM installer SHA-256 did not match the pinned value"
          }
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait -WindowStyle Hidden
          if (-not (Test-Path -LiteralPath (Join-Path $env:LIBCLANG_PATH 'libclang.dll'))) {
            throw "LLVM $env:LLVM_VERSION did not install libclang.dll"
          }
          & (Join-Path $env:LIBCLANG_PATH 'clang.exe') --version

      - name: Install pinned Ninja
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ninja-$env:NINJA_VERSION-win.zip"
          $installRoot = Join-Path $env:RUNNER_TOOL_CACHE "ninja\$env:NINJA_VERSION\x64"
          $uri = "https://github.com/ninja-build/ninja/releases/download/v$env:NINJA_VERSION/ninja-win.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if (-not [string]::Equals($actualSha256, $env:NINJA_SHA256, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Ninja archive SHA-256 did not match the pinned value"
          }
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot -Force
          $ninja = Join-Path $installRoot 'ninja.exe'
          $actualVersion = (& $ninja --version).Trim()
          if ($actualVersion -ne $env:NINJA_VERSION) {
            throw "expected Ninja $env:NINJA_VERSION, got $actualVersion"
          }
          $installRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Output "Ninja $actualVersion is configured with CMAKE_GENERATOR=$env:CMAKE_GENERATOR"

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Test the audio crate
        run: cargo test -p screenpipe-audio

      - name: Test the CLI audio feature
        run: cargo test -p screenpipe-cli --features audio

      - name: Check the CLI audio feature
        run: cargo check -p screenpipe-cli --features audio

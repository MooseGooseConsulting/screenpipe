[package]
name = "screenpipe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "screenpipe"
path = "src/main.rs"

[features]
# The audio channel, off by default and compiled out entirely when it is.
#
# This is the strongest form of "off": without the feature the binary has no
# `audio` subcommand, no whisper model in memory, and no code path that can
# open a microphone - and building it needs neither CMake nor libclang, which
# whisper.cpp and its bindings otherwise require.
#
# Turning the feature on still records nothing. It has to be run
# (`screenpipe audio run`) or installed (`screenpipe audio service install`),
# both of which are separate deliberate acts. See the README Audio channel
# section.
default = []
audio = ["dep:screenpipe-audio"]

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1"
chrono = "0.4"
clap = { version = "4.5.51", features = ["derive"] }
screenpipe-audio = { path = "../screenpipe-audio", optional = true }
screenpipe-memory = { path = "../screenpipe-memory" }
screenpipe-screen = { path = "../screenpipe-screen" }
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
assert_cmd = "2.1.1"
chrono-tz = "0.10"
predicates = "3.1.3"
tempfile = "3.23.0"

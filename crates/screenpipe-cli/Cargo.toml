[package]
name = "screenpipe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "screenpipe"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1"
chrono = "0.4"
clap = { version = "4.5.51", features = ["derive"] }
screenpipe-memory = { path = "../screenpipe-memory" }
screenpipe-screen = { path = "../screenpipe-screen" }
tokio = { version = "1", features = ["macros", "rt", "time"] }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"

[package]
name = "screenpipe-memory"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
caseless = "0.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# `tls-native-tls` is deliberate here: SQLx maps `sslmode=verify-ca` to
# certificate-chain verification with hostname verification disabled, and adds
# the `sslrootcert` PEM directly to the connector. On Windows this uses the
# native TLS provider; no machine-wide Windows trust-store change is required
# for the CloudNativePG CA.
sqlx = { version = "0.8", default-features = false, features = [
    "chrono",
    "json",
    "postgres",
    "runtime-tokio",
    "tls-native-tls",
] }
unicode-normalization = "=0.1.24"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1", features = ["macros", "rt"] }

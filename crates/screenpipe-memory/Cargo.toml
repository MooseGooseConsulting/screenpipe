[package]
name = "screenpipe-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
caseless = "0.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio"] }
unicode-normalization = "=0.1.24"

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1", features = ["macros", "rt"] }

[workspace]
members = [
    "crates/screenpipe-screen",
    "crates/screenpipe-memory",
    "crates/screenpipe-audio",
    "crates/screenpipe-cli",
]

# `screenpipe-audio` is a workspace member so it can be selected explicitly,
# but it is deliberately absent from `default-members`. A bare `cargo build`
# or `cargo test` covers the screen, memory, and CLI packages without requiring
# the audio channel's CMake/libclang toolchain. Audio remains available by
# name: `cargo test -p screenpipe-audio`.
#
# That is the first of the two layers that keep this channel off. The second is
# the `audio` feature on screenpipe-cli: without it the binary has no audio
# subcommand at all. See crates/screenpipe-audio/src/lib.rs.
default-members = [
    "crates/screenpipe-screen",
    "crates/screenpipe-memory",
    "crates/screenpipe-cli",
]
exclude = ["vendor/wasapi", "vendor/xcap"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MooseGooseConsulting/screenpipe"

[profile.release]
codegen-units = 1
lto = true
strip = true

[patch.crates-io]
wasapi = { path = "vendor/wasapi" }
xcap = { path = "vendor/xcap" }
